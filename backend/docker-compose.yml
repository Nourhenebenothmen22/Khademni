services:
  postgres:
    image: postgres:16-alpine
    container_name: recruitment_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruitment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_db}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recruitment_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-recruitment_user} -d ${POSTGRES_DB:-recruitment_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - recruitment_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${PORT:-3000}/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  recruitment_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
